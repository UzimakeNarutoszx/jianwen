<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="常用网址与应用导航"><title>网址与应用 · 见闻</title><link rel="stylesheet" href="css/site.css?v=20260919-6">  <link rel="stylesheet" href="css/pages/links.css?v=20260919-6">

<link rel="stylesheet" href="css/editorial.css?v=20260919-6">
<link rel="icon" href="assets/brand.webp" type="image/webp">
</head>
<body data-page="links">
  <header data-site-header></header>
  <main class="page-shell">
    <section class="page-intro compact"><p class="eyebrow">LINKS &amp; TOOLS</p><h1>我常用的网址</h1><p>按用途整理常用网站，点击链接将在新标签页打开。</p></section>
    <section class="link-toolbar" aria-label="网址筛选">
      <label class="search-field" for="links-search"><span aria-hidden="true">⌕</span><input id="links-search" type="search" placeholder="搜索网站、用途或分类" autocomplete="off"></label>
      <div id="link-filters" class="filter-row" role="group" aria-label="分类筛选"><button class="filter-button active" type="button" data-filter="">全部</button></div>
    </section>
    <p id="links-count" class="links-note" aria-live="polite">正在加载网址…</p>
    <div id="link-groups" class="link-groups" aria-live="polite"></div>
    <div id="links-empty" class="empty-state" hidden><strong>没有找到匹配网址</strong><p>试试更短的关键词，或清除筛选条件。</p><button class="button button-secondary" type="button" id="links-clear">清除搜索</button></div>
  </main>
  <footer data-site-footer></footer>
  <script src="js/site.js?v=20260919-6"></script><script src="js/data.js"></script><script src="js/links.js"></script>
  <script>
    (() => {
      const groups = document.querySelector('#link-groups'); const filters = document.querySelector('#link-filters'); const search = document.querySelector('#links-search'); const empty = document.querySelector('#links-empty'); const count = document.querySelector('#links-count'); const clear = document.querySelector('#links-clear');
      const links = [...(window.portalData?.links || []), { category: 'AI 工具', name: 'HaoLab', description: '阿烬的来源与智能体设计网站', url: 'https://wexiyi.com/agents/' }]; const categoryOrder = ['常用工具', 'AI 工具', '图片工具', '开发']; let category = '';
      const render = () => { const query = search.value.trim().toLowerCase(); const matched = links.filter(item => (!category || item.category === category) && (!query || `${item.name} ${item.description} ${item.category}`.toLowerCase().includes(query))); const byCategory = matched.reduce((result, item) => { (result[item.category] ||= []).push(item); return result; }, {}); groups.innerHTML = Object.entries(byCategory).sort(([a], [b]) => (categoryOrder.indexOf(a) + 1 || 99) - (categoryOrder.indexOf(b) + 1 || 99)).map(([name, items]) => `<section class="link-group"><div class="group-heading"><p class="eyebrow">COLLECTION</p><h2>${name}</h2></div><div class="link-list">${items.map(item => `<a class="link-item" href="${item.url}" target="_blank" rel="noopener noreferrer"><span class="link-symbol" aria-hidden="true">↗</span><div><strong>${item.name}</strong><p>${item.description}</p></div><span class="link-arrow" aria-hidden="true">↗</span></a>`).join('')}</div></section>`).join(''); empty.hidden = matched.length > 0; count.textContent = `共 ${matched.length} 个网址${query || category ? '（已筛选）' : ''}`; };
      [...new Set(links.map(item => item.category))].forEach(name => { const button = document.createElement('button'); button.className = 'filter-button'; button.type = 'button'; button.dataset.filter = name; button.textContent = name; filters.append(button); });
      filters.addEventListener('click', event => { const button = event.target.closest('[data-filter]'); if (!button) return; category = button.dataset.filter; filters.querySelectorAll('.filter-button').forEach(item => item.classList.toggle('active', item === button)); render(); }); search.addEventListener('input', render); clear.addEventListener('click', () => { search.value = ''; category = ''; filters.querySelectorAll('.filter-button').forEach((item, index) => item.classList.toggle('active', index === 0)); render(); search.focus(); }); render();
    })();
  </script>
</body>
</html>
