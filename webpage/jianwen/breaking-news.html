<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>大事报道 · 见闻</title><link rel="stylesheet" href="../css/site.css?v=20261025-3"><link rel="stylesheet" href="../css/pages/breaking-news.css?v=20261025-3"><link rel="stylesheet" href="../css/editorial.css?v=20261025-3"></head><body data-page="jianwen-article"><header data-site-header></header><main class="page-shell"><div id="breaking-detail" class="breaking-detail"><p class="eyebrow">JIANWEN / BREAKING NEWS</p><h1>正在加载大事报道…</h1></div></main><footer data-site-footer></footer><script src="../js/site.js?v=20261025-3"></script><script src="../js/api-browser.js?v=20261025-3"></script><script>(async()=>{const root=document.querySelector('#breaking-detail'),key=new URLSearchParams(location.search).get('key');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(!key)return;try{const item=await jianwenApi.breakingNewsDetail(key);document.title=`${item.title} · 见闻`;root.innerHTML=`<p class="eyebrow">JIANWEN / BREAKING NEWS</p><span class="breaking-news-label">${esc(item.event_type)} · 已确认</span><h1>${esc(item.title)}</h1><p class="breaking-meta">最新权威报道：${esc(item.latest_reported_at||'')} · ${item.is_ongoing?'事件仍在进行':'来源摘要'}</p><section class="breaking-summary">${esc(item.summary)}</section><section class="breaking-sources"><h2>权威来源</h2><ul>${(item.sources||[]).map(s=>`<li><strong>${esc(s.name)}</strong>：<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)}</a></li>`).join('')}</ul></section><a class="button button-secondary" href="index.html">返回今日</a>`}catch(error){root.innerHTML='<h1>大事报道暂时不可用</h1><p class="breaking-meta">这条报道可能已超过有效期。</p><a class="button button-secondary" href="index.html">返回今日</a>'}})();</script></body></html>
