<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>发现 · 见闻</title><link rel="stylesheet" href="../css/site.css?v=20261002-1"><link rel="stylesheet" href="../css/pages/jianwen-discover.css?v=20261002-1"><link rel="stylesheet" href="../css/editorial.css?v=20261002-1"><link rel="icon" href="../assets/agents.png?v=agents-1" type="image/png"></head>
<body data-page="jianwen-discover"><header data-site-header></header><main class="page-shell">
<section class="discover-hero"><div><p class="eyebrow">JIANWEN / DISCOVER</p><h1>从主题进入世界</h1><p>搜索、专题、最近更新与经典原典，都在一个发现大厅里继续阅读。</p></div><div class="discover-status"><strong>探索大厅</strong><span>主题 · 专题 · 原典</span></div></section>
<section id="discover-search" class="discover-search-panel" aria-labelledby="discover-search-title"><div><p class="eyebrow">SEARCH</p><h2 id="discover-search-title">先搜一个问题</h2></div><form id="search-form" class="discover-search-form"><label class="search-field"><span aria-hidden="true">⌕</span><input id="query" type="search" placeholder="搜索文章、主题或来源" aria-label="搜索文章"></label><button class="button button-primary" type="submit">搜索</button></form><div id="categories" class="filter-row" aria-label="内容分类"></div><div class="search-summary"><span id="result-count">输入关键词开始检索</span><button id="clear-search" class="search-clear" type="button" hidden>清除条件</button></div><div id="results" class="discover-results" aria-live="polite"></div></section>
<div id="discover" class="discover-layout"><div class="empty-state">加载中…</div></div>
<section id="classics" class="discover-section classics-section" aria-labelledby="classics-title"><div class="discover-heading"><div><p class="eyebrow">CLASSICS</p><h2 id="classics-title">回到思想的源头</h2></div><span id="book-count">正在整理书架…</span></div><div class="classics-tools"><input id="book-search" class="classics-search" type="search" aria-label="搜索书名、作者或类别" placeholder="搜索书名、作者或类别" autocomplete="off"></div><div id="books" class="work-grid" aria-busy="true"><div class="empty-state">加载中…</div></div></section>
</main><footer data-site-footer></footer>
<script src="../js/site.js?v=20261002-1"></script><script src="../js/api-browser.js?v=20261002-1"></script>
<script>
(function(){const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const imageUrl=v=>{if(!v||!String(v).startsWith('/static/images/'))return '';const n=decodeURIComponent(String(v).split('/').pop()||'');return n?'../asset/images/'+encodeURIComponent(n):''};
let category=new URLSearchParams(location.search).get('category')||'', version=0;const query=document.querySelector('#query'),results=document.querySelector('#results'),categories=document.querySelector('#categories'),count=document.querySelector('#result-count'),clear=document.querySelector('#clear-search');
async function runSearch(){const current=++version;results.innerHTML='<div class="empty-state">加载中…</div>';count.textContent='搜索中…';clear.hidden=!(query.value.trim()||category);try{const data=await jianwenApi.articles({q:query.value.trim(),category});if(current!==version)return;count.textContent=`${data.length} 条结果`;results.innerHTML=data.length?data.map(i=>`<article class="search-result"><p class="eyebrow">${esc(i.topic||i.category||'见闻')}</p><h3>${esc(i.title)}</h3><p>${esc(i.desc||'打开文章查看完整内容与来源依据。')}</p><a class="text-link" href="article.html?id=${encodeURIComponent(i.article_id||i.id)}&v=20261002-1">阅读详情 ↗</a></article>`).join(''):'<div class="empty-state"><strong>没有找到相关内容</strong><p>换个关键词，或从主题频道开始浏览。</p></div>'}catch(e){results.innerHTML=`<div class="empty-state"><strong>搜索服务暂不可用</strong><p>${esc(e.message)}</p></div>`}}
async function loadCategories(){try{const data=await jianwenApi.categories();categories.innerHTML='<button class="filter-button '+(!category?'active':'')+'" type="button" data-category="">全部</button>'+data.map(i=>`<button class="filter-button ${i.name===category?'active':''}" type="button" data-category="${esc(i.name)}">${esc(i.name)}</button>`).join('')}catch(e){categories.innerHTML=''}}
categories.addEventListener('click',e=>{const b=e.target.closest('[data-category]');if(!b)return;category=b.dataset.category;query.value='';categories.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));runSearch()});document.querySelector('#search-form').addEventListener('submit',e=>{e.preventDefault();category='';categories.querySelectorAll('button').forEach(x=>x.classList.toggle('active',!x.dataset.category));runSearch()});clear.addEventListener('click',()=>{category='';query.value='';results.innerHTML='';count.textContent='输入关键词开始检索';clear.hidden=true;categories.querySelectorAll('button').forEach((x,i)=>x.classList.toggle('active',i===0))});
(async()=>{const root=document.querySelector('#discover');try{const d=await jianwenApi.discover(),topics=Array.isArray(d.topics)?d.topics:[],features=Array.isArray(d.features)?d.features:[],updates=Array.isArray(d.updates)?d.updates:[];const topicCards=topics.map(i=>{const im=imageUrl(i.image);return `<a class="topic-card" href="#discover-search" data-topic="${esc(i.name)}">${im?`<img class="topic-image" src="${esc(im)}" alt="" loading="lazy">`:`<span class="topic-initial">${esc(String(i.name||'见').slice(0,1))}</span>`}<span class="topic-name">${esc(i.name)}</span></a>`}).join('');const featureCards=features.map(i=>`<a class="discover-feature" href="#discover-search" data-topic="${esc(i.category_name||'')}">${imageUrl(i.image)?`<img class="feature-image" src="${esc(imageUrl(i.image))}" alt="" loading="lazy">`:''}<span class="feature-meta"><span>${esc(i.category_name||'专题')}</span><span>${esc(i.count||0)} 篇</span></span><strong>${esc(i.title)}</strong><p>${esc(i.desc||'')}</p></a>`).join('');const updateCards=updates.map((i,n)=>`<a class="update-card" href="article.html?id=${encodeURIComponent(i.article_id||i.id)}&v=20261002-1"><span class="update-rank">${String(n+1).padStart(2,'0')}</span><span class="update-copy"><span class="update-meta">${esc(i.topic||i.category||'公共议题')}</span><strong>${esc(i.title)}</strong><span class="update-desc">${esc(i.desc||'')}</span></span></a>`).join('');root.innerHTML=`<section class="discover-section topic-section"><div class="discover-heading"><div><p class="eyebrow">TOPIC HALL</p><h2>主题频道</h2></div><span>${topics.length} 个入口</span></div><div class="topic-grid">${topicCards||'<p>暂无主题。</p>'}</div></section><div class="discover-columns"><section class="discover-section"><div class="discover-heading"><div><p class="eyebrow">SPECIAL FILES</p><h2>专题简报</h2></div><span>成组理解</span></div><div class="discover-feature-list">${featureCards||'<p>暂无专题。</p>'}</div></section><section class="discover-section"><div class="discover-heading"><div><p class="eyebrow">LIVE UPDATE</p><h2>最近更新</h2></div><span>来自后端</span></div><div class="update-list">${updateCards||'<p>暂无更新。</p>'}</div></section></div>`;root.querySelectorAll('[data-topic]').forEach(a=>a.addEventListener('click',()=>{category=a.dataset.topic;query.value='';loadCategories().then(runSearch)}))}catch(e){root.innerHTML=`<div class="empty-state"><strong>发现内容加载失败</strong><p>${esc(e.message)}</p></div>`}})();
let books=[];const bookRoot=document.querySelector('#books');function renderBooks(){const q=document.querySelector('#book-search').value.trim().toLocaleLowerCase(),filtered=books.filter(i=>[i.title,i.author,i.category].join(' ').toLocaleLowerCase().includes(q));document.querySelector('#book-count').textContent=q?`找到 ${filtered.length} 本经典`:`${books.length} 本经典 · 阅读进度保存在此设备`;bookRoot.innerHTML=filtered.map(i=>{let saved=null;try{saved=JSON.parse(localStorage.getItem('jianwen_web_reader_'+encodeURIComponent(i.book_id))||'null')}catch{};return `<article class="classic-card"><span class="classic-index">${String(books.indexOf(i)+1).padStart(2,'0')}</span><div><p class="eyebrow">${esc(i.category||'经典')}</p><h3>${esc(i.title)}</h3><p class="classic-author">${esc(i.author||'经典文献')}</p><p class="classic-description">${esc(i.description||'从原典出发，建立可靠的阅读坐标。')}</p></div><div><a class="classic-open" href="reader.html?book=${encodeURIComponent(i.book_id)}&v=20261002-1">${saved?.chapterId?'继续阅读':'打开阅读'} →</a>${saved?.chapterTitle?`<p class="classic-progress">上次读到 · ${esc(saved.chapterTitle)}</p>`:''}</div></article>`}).join('')||'<div class="empty-state">没有找到匹配的经典。</div>'}document.querySelector('#book-search').addEventListener('input',renderBooks);(async()=>{try{books=await jianwenApi.classicBooks();renderBooks()}catch(e){bookRoot.innerHTML='<div class="empty-state">经典文献加载失败</div>'}})();loadCategories();if(category){runSearch();document.querySelector('#discover-search').scrollIntoView({block:'start'})}})();
</script></body></html>
