<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>发现 · 见闻</title><link rel="stylesheet" href="../css/site.css?v=20261115-2"><link rel="stylesheet" href="../css/pages/jianwen-discover.css?v=20261114-2"><style id="discover-updates-inline">
/* 最近更新：整行带配图的卡片网格，列数按容器宽度自适应（不再用视口媒体查询硬切列数）。 */
/* 「专题简报」现在独占 .discover-columns（最近更新已移出），让它占满整行。 */
.discover-columns{grid-template-columns:minmax(0,1fr)}
/* .discover-layout 自身 gap 为 56px，这里不再额外加外边距。 */
.update-section{min-width:0}
/* 搜索结果整卡现在是一个 <a>，保持块级以免 <p>/<h3> 撑不开点击区。 */
.search-result-link{display:block;color:inherit}
.update-groups{display:grid;gap:40px}
.update-group{min-width:0}
.update-group-heading{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 16px}
.update-group-heading h3{margin:0;color:var(--blue-dark);font-size:15px;font-weight:600;letter-spacing:.02em}
.update-group-count{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.update-date{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
/* 列数按容器宽度自适应（整行约 3–4 列，手机 1 列），不再用视口媒体查询硬切。 */
.update-groups .update-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px}
.update-groups .update-list>p{grid-column:1/-1;margin:0;color:var(--muted);font-size:13px}
.update-fold{display:grid;grid-template-rows:0fr;transition:grid-template-rows .24s ease}
.update-fold.is-open{grid-template-rows:1fr}
.update-fold-inner{min-height:0;overflow:hidden}
/* 折叠区内的网格与主网格保持同样的 24px 间距，展开后两段之间也是 24px。 */
.update-fold-inner>.update-list{padding-top:24px}
.update-toggle{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:16px;padding:11px 16px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--blue-dark);font-size:13px;font-weight:600;transition:background-color .14s,border-color .14s,color .14s}
.update-toggle:hover{border-color:var(--blue);background:var(--mist);color:var(--blue-dark)}
.update-toggle-extra{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}

/* 卡片：内边距 16px；图与文字间距 12px；分类日期 / 标题 / 摘要之间 6px。层级用明度微差，不用黑边。
   选择器加 .update-groups 前缀是为了压过后加载的 editorial.css（它有 .update-card 与 :hover 覆写）。 */
.update-groups .update-list .update-card{position:relative;display:flex;flex-direction:column;gap:12px;height:100%;min-width:0;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--surface-card);box-shadow:0 12px 28px rgba(31,47,58,.06);transition:transform .16s,box-shadow .16s,border-color .16s}
.update-groups .update-card .update-cover{display:block;flex:0 0 auto;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:var(--mist)}
.update-groups .update-card .update-body{display:flex;min-width:0;flex:1 1 auto;flex-direction:column;gap:6px}
.update-groups .update-card .update-meta{display:flex;align-items:center;justify-content:flex-start;gap:6px;color:var(--blue);font-size:10px;font-weight:800;letter-spacing:.04em}
.update-groups .update-card .update-meta span+span:before{content:'·';margin-right:6px;color:var(--muted)}
.update-groups .update-card .update-title{display:-webkit-box;overflow:hidden;font-size:15px;font-weight:600;line-height:1.45;text-wrap:pretty;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.update-groups .update-card .update-desc{display:-webkit-box;overflow:hidden;color:var(--muted);font-size:12px;line-height:1.55;text-wrap:pretty;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.update-groups .update-list .update-card:focus-visible{outline:0;box-shadow:0 0 0 1px var(--focus-ring),0 0 0 4px var(--focus-halo);transition:box-shadow .14s}
@media(hover:hover){.update-groups .update-list .update-card:hover{transform:translateY(-2px);border-color:rgba(31,95,122,.18);box-shadow:0 20px 40px rgba(31,47,58,.12)}}
/* 暗底字重按 60% 收：600→360、800→480。 */
@media(prefers-color-scheme:dark){.update-groups .update-card .update-title{font-weight:360}.update-groups .update-card .update-meta{font-weight:480}}
@media(prefers-reduced-motion:reduce){.update-fold{transition:none}.update-groups .update-list .update-card{transition:none}.update-groups .update-list .update-card:hover{transform:none}}
</style><link rel="stylesheet" href="../css/editorial.css?v=20261115-2"><link rel="icon" href="../assets/agents-96.png?v=agents-1" type="image/png"></head>
<body data-page="jianwen-discover"><header data-site-header></header><main class="page-shell">
<section class="discover-hero"><div><p class="eyebrow">JIANWEN / DISCOVER</p><h1>从主题进入世界</h1><p>搜索、专题、最近更新与经典原典，都在一个发现大厅里继续阅读。</p></div><div class="discover-status"><strong>探索大厅</strong><span>主题 · 专题 · 原典</span></div></section>
<section id="discover-search" class="discover-search-panel" aria-labelledby="discover-search-title"><div><p class="eyebrow">SEARCH</p><h2 id="discover-search-title">先搜一个问题</h2></div><form id="search-form" class="discover-search-form"><label class="search-field"><span aria-hidden="true">⌕</span><input id="query" type="search" placeholder="搜索文章、主题或来源" aria-label="搜索文章"></label><button class="button button-primary" type="submit">搜索</button></form><div id="categories" class="filter-row" aria-label="内容分类"></div><div class="search-summary"><span id="result-count">输入关键词开始检索</span><button id="clear-search" class="search-clear" type="button" hidden>清除条件</button></div><div id="results" class="discover-results" aria-live="polite"></div></section>
<div id="discover" class="discover-layout"><div class="empty-state">加载中…</div></div>
<section id="classics" class="discover-section classics-section" aria-labelledby="classics-title"><div class="discover-heading"><div><p class="eyebrow">CLASSICS</p><h2 id="classics-title">回到思想的源头</h2></div><span id="book-count">正在整理书架…</span></div><div class="classics-tools"><input id="book-search" class="classics-search" type="search" aria-label="搜索书名、作者或类别" placeholder="搜索书名、作者或类别" autocomplete="off"></div><div id="books" class="work-grid" aria-busy="true"><div class="empty-state">加载中…</div></div></section>
</main><footer data-site-footer></footer>
<script src="../js/site.js?v=20261115-2"></script><script src="../js/api-browser.js?v=20261115-2"></script>
<script>
(function(){const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const imageUrl=v=>{if(!v||!String(v).startsWith('/static/images/'))return '';let n=decodeURIComponent(String(v).split('/').pop()||'');return n?jianwenApi.baseUrl()+'/static/images/'+encodeURIComponent(n):''};
let category=new URLSearchParams(location.search).get('category')||'', version=0;const query=document.querySelector('#query'),results=document.querySelector('#results'),categories=document.querySelector('#categories'),count=document.querySelector('#result-count'),clear=document.querySelector('#clear-search');
async function runSearch(){const current=++version;results.innerHTML='<div class="empty-state">加载中…</div>';count.textContent='搜索中…';clear.hidden=!(query.value.trim()||category);try{const data=await jianwenApi.articles({q:query.value.trim(),category});if(current!==version)return;count.textContent=`${data.length} 条结果`;results.innerHTML=data.length?data.map(i=>`<article class="search-result"><a class="search-result-link" href="article.html?id=${encodeURIComponent(i.article_id||i.id)}&from=discover&v=20261115-2"><p class="eyebrow">${esc(i.topic||i.category||'见闻')}</p><h3>${esc(i.title)}</h3><p>${esc(i.desc||'打开文章查看完整内容与来源依据。')}</p><span class="text-link">阅读详情 ↗</span></a></article>`).join(''):'<div class="empty-state"><strong>没有找到相关内容</strong><p>换个关键词，或从主题频道开始浏览。</p></div>'}catch(e){results.innerHTML=`<div class="empty-state"><strong>搜索服务暂不可用</strong><p>${esc(e.message)}</p></div>`}}
async function loadCategories(){try{const data=await jianwenApi.categories();categories.innerHTML='<button class="filter-button '+(!category?'active':'')+'" type="button" data-category="">全部</button>'+data.map(i=>`<button class="filter-button ${i.name===category?'active':''}" type="button" data-category="${esc(i.name)}">${esc(i.name)}</button>`).join('')}catch(e){categories.innerHTML=''}}
categories.addEventListener('click',e=>{const b=e.target.closest('[data-category]');if(!b)return;category=b.dataset.category;query.value='';categories.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));runSearch()});document.querySelector('#search-form').addEventListener('submit',e=>{e.preventDefault();category='';categories.querySelectorAll('button').forEach(x=>x.classList.toggle('active',!x.dataset.category));runSearch()});clear.addEventListener('click',()=>{category='';query.value='';results.innerHTML='';count.textContent='输入关键词开始检索';clear.hidden=true;categories.querySelectorAll('button').forEach((x,i)=>x.classList.toggle('active',i===0))});
function parsePublishedDate(value){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(value||''));if(!m)return null;const y=Number(m[1]),mo=Number(m[2])-1,d=Number(m[3]),date=new Date(y,mo,d);return date.getFullYear()===y&&date.getMonth()===mo&&date.getDate()===d?date:null}
function startOfWeek(now){const date=new Date(now.getFullYear(),now.getMonth(),now.getDate());date.setDate(date.getDate()-((date.getDay()+6)%7));return date}
function startOfMonth(now){return new Date(now.getFullYear(),now.getMonth(),1)}
function updateGroupLabel(date,now){if(date>=startOfWeek(now))return '本周';if(date>=startOfMonth(now))return '本月';return '更早'}
function updateCardHtml(item,index,withDate){const label=jianwenApi.articleUpdateLabel(item),date=label?`<span class="update-date">${esc(label)}</span>`:'';const im=imageUrl(item.image),cover=im?`<img class="update-cover" src="${esc(im)}" alt="" loading="lazy" decoding="async" width="640" height="360">`:'<span class="update-cover" aria-hidden="true"></span>';return `<a class="update-card" href="article.html?id=${encodeURIComponent(item.article_id||item.id)}&from=discover&v=20261115-2">${cover}<span class="update-body"><span class="update-meta"><span>${esc(item.topic||item.category||'公共议题')}</span>${date}</span><strong class="update-title">${esc(item.title)}</strong><span class="update-desc">${esc(item.desc||'')}</span></span></a>`}
function renderUpdates(updates){const rows=updates.map(item=>({item,date:parsePublishedDate(item.published_date)}));if(!rows.length)return '<div class="update-list"><p>暂无更新。</p></div>';if(!rows.every(row=>row.date))return `<div class="update-list">${updates.map((item,index)=>updateCardHtml(item,index,false)).join('')}</div>`;const now=new Date(),order=['本周','本月','更早'],buckets={'本周':[],'本月':[],'更早':[]};rows.forEach(row=>buckets[updateGroupLabel(row.date,now)].push(row.item));let foldId=0;return order.filter(label=>buckets[label].length).map(label=>{const items=buckets[label],head=items.slice(0,6),rest=items.slice(6),heading=`<div class="update-group-heading"><h3>${label}</h3><span class="update-group-count">${items.length} 篇</span></div>`,list=`<div class="update-list">${head.map((item,index)=>updateCardHtml(item,index,true)).join('')}</div>`;if(!rest.length)return `<section class="update-group" aria-label="${label}">${heading}${list}</section>`;const id=`update-fold-${++foldId}`;return `<section class="update-group" aria-label="${label}">${heading}${list}<div class="update-fold" id="${id}"><div class="update-fold-inner"><div class="update-list update-more-list">${rest.map((item,index)=>updateCardHtml(item,head.length+index,true)).join('')}</div></div></div><button class="update-toggle" type="button" aria-expanded="false" aria-controls="${id}" data-collapsed-label="展开更多"><span data-toggle-text>展开更多</span><span class="update-toggle-extra">还有 ${rest.length} 篇</span></button></section>`}).join('')}
function bindUpdateToggles(root){root.querySelectorAll('.update-toggle').forEach(button=>{const fold=document.getElementById(button.getAttribute('aria-controls')||''),text=button.querySelector('[data-toggle-text]'),label=button.dataset.collapsedLabel||'展开更多';if(!fold||!text)return;const apply=open=>{button.setAttribute('aria-expanded',String(open));fold.classList.toggle('is-open',open);if('inert' in HTMLElement.prototype)fold.inert=!open;text.textContent=open?'收起':label};apply(false);button.addEventListener('click',()=>apply(button.getAttribute('aria-expanded')!=='true'))})}
(async()=>{const root=document.querySelector('#discover');try{const d=await jianwenApi.discover(),topics=Array.isArray(d.topics)?d.topics:[],features=Array.isArray(d.features)?d.features:[],updates=Array.isArray(d.updates)?d.updates:[];const topicCards=topics.map(i=>{const im=imageUrl(i.image);return `<a class="topic-card" href="category.html?name=${encodeURIComponent(i.name)}&v=20261115-2">${im?`<img class="topic-image" src="${esc(im)}" alt="" loading="lazy">`:`<span class="topic-initial">${esc(String(i.name||'见').slice(0,1))}</span>`}<span class="topic-name">${esc(i.name)}</span></a>`}).join('');const featureCards=features.map(i=>`<a class="discover-feature" href="category.html?name=${encodeURIComponent(i.category_name||i.title||'')}&v=20261115-2">${imageUrl(i.image)?`<img class="feature-image" src="${esc(imageUrl(i.image))}" alt="" loading="lazy">`:''}<span class="feature-meta"><span>${esc(i.category_name||'专题')}</span><span>${esc(i.count||0)} 篇</span></span><strong>${esc(i.title)}</strong><p>${esc(i.desc||'')}</p></a>`).join('');const updateCards=renderUpdates(updates);root.innerHTML=`<section class="discover-section topic-section"><div class="discover-heading"><div><p class="eyebrow">TOPIC HALL</p><h2>主题频道</h2></div><span>${topics.length} 个入口</span></div><div class="topic-grid">${topicCards||'<p>暂无主题。</p>'}</div></section><div class="discover-columns"><section class="discover-section"><div class="discover-heading"><div><p class="eyebrow">SPECIAL FILES</p><h2>专题简报</h2></div><span>成组理解</span></div><div class="discover-feature-list">${featureCards||'<p>暂无专题。</p>'}</div></section></div><section class="discover-section update-section"><div class="discover-heading"><div><p class="eyebrow">LIVE UPDATE</p><h2>最近更新</h2></div><span>来自后端</span></div><div class="update-groups" id="update-groups">${updateCards}</div></section>`;bindUpdateToggles(root)}catch(e){root.innerHTML=`<div class="empty-state"><strong>发现内容加载失败</strong><p>${esc(e.message)}</p></div>`}})();
let books=[];const bookRoot=document.querySelector('#books');function renderBooks(){const q=document.querySelector('#book-search').value.trim().toLocaleLowerCase(),filtered=books.filter(i=>[i.title,i.author,i.category].join(' ').toLocaleLowerCase().includes(q));document.querySelector('#book-count').textContent=q?`找到 ${filtered.length} 本经典`:`${books.length} 本经典 · 阅读进度保存在此设备`;bookRoot.innerHTML=filtered.map(i=>{let saved=null;try{saved=JSON.parse(localStorage.getItem('jianwen_web_reader_'+encodeURIComponent(i.book_id))||'null')}catch{};return `<article class="classic-card"><span class="classic-index">${String(books.indexOf(i)+1).padStart(2,'0')}</span>${i.cover_image?`<img class="classic-cover" src="${esc(imageUrl(i.cover_image))}" alt="" loading="lazy" decoding="async" width="56" height="76">`:'<span class="classic-cover" aria-hidden="true"></span>'}<div><p class="eyebrow">${esc(i.category||'经典')}</p><h3>${esc(i.title)}</h3><p class="classic-author">${esc(i.author||'经典文献')}</p></div><div><a class="classic-open" href="reader.html?book=${encodeURIComponent(i.book_id)}&v=20261115-2">${saved?.chapterId?'继续阅读':'打开阅读'} →</a>${saved?.chapterTitle?`<p class="classic-progress">上次读到 · ${esc(saved.chapterTitle)}</p>`:''}</div></article>`}).join('')||'<div class="empty-state">没有找到匹配的经典。</div>'}document.querySelector('#book-search').addEventListener('input',renderBooks);(async()=>{try{books=await jianwenApi.classicBooks();renderBooks()}catch(e){bookRoot.innerHTML='<div class="empty-state">经典文献加载失败</div>'}})();loadCategories();if(category){runSearch();document.querySelector('#discover-search').scrollIntoView({block:'start'})}})();
</script></body></html>
