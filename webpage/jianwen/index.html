<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>见闻 · 今日</title>
  <link rel="stylesheet" href="../css/site.css?v=20261110-2">
  <link rel="stylesheet" href="../css/pages/jianwen-index.css?v=20261110-2">

<link rel="stylesheet" href="../css/editorial.css?v=20261110-2">
<style id="major-event-inline">
.major-event{margin:28px 0 8px}
.major-event-card{display:grid;grid-template-columns:minmax(200px,320px) 1fr;gap:24px;align-items:center;padding:20px;border-radius:20px;background:var(--surface-card,#fffefa);box-shadow:0 1px 2px rgba(20,33,43,.06),0 12px 32px rgba(20,33,43,.08);color:inherit;text-decoration:none}
.major-event-image{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:14px;background:var(--surface-raised,#f1f3ef)}
.major-event-body{display:flex;flex-direction:column;gap:10px;min-width:0}
.major-event-eyebrow{display:flex;align-items:center;gap:10px;margin:0;color:#b5413a;font-size:13px;font-weight:700;letter-spacing:.08em}
.major-event-badge{padding:2px 10px;border-radius:999px;background:#b5413a;color:#fff;font-size:12px;letter-spacing:0}
.major-event-badge.is-closed{background:var(--muted,#6c7880)}
.major-event-body h2{margin:0;font-size:24px;line-height:1.35;text-wrap:balance}
.major-event-summary{margin:0;color:var(--muted,#4b5a63);line-height:1.75;text-wrap:pretty}
.major-event-meta{margin:0;color:var(--muted,#6c7880);font-size:13px;font-variant-numeric:tabular-nums}
a.major-event-card:focus-visible{outline:0;box-shadow:0 0 0 1px var(--focus-ring),0 0 0 4px var(--focus-halo)}
@media(max-width:720px){.major-event-card{grid-template-columns:1fr;gap:16px;padding:16px}.major-event-body h2{font-size:20px}}
</style>
<link rel="icon" href="../assets/agents-96.png?v=agents-1" type="image/png">
</head>
<body data-page="jianwen-index">
  <header data-site-header></header>
  <main class="page-shell">
    <section id="major-event" class="major-event" aria-label="大事报道" hidden></section>
    <section class="daily-hero" aria-labelledby="daily-title">
      <div class="page-intro compact">
        <p class="eyebrow">JIANWEN / DAILY BRIEFING</p>
        <h1 id="daily-title">今天，值得看懂的事</h1>
        <p id="jianwen-state" role="status">正在连接见闻内容服务…</p>
      </div>
      <aside class="daily-quote" aria-label="每日金句">
        <p class="eyebrow">每日金句</p>
        <blockquote id="daily-quote">正在加载今日金句…</blockquote>
        <cite id="daily-quote-source">见闻</cite>
        <div class="quote-explain" id="quote-explain" hidden>
          <p><strong>白话解释</strong> <span data-plain></span></p>
          <p><strong>今日关联</strong> <span data-connection></span></p>
        </div>
      </aside>
    </section>

    <section class="briefing-strip" aria-label="今日阅读概览">
      <div class="briefing-stat"><span class="briefing-number" id="today-count">—</span>今日事项</div>
      <div class="briefing-stat"><span class="briefing-number" id="today-read">—</span>已读篇数</div>
      <div class="briefing-stat"><span class="briefing-number" id="today-progress">—</span>理解进度</div>
    </section>

    <p class="daily-progress" id="daily-progress">今日理解进度会随已读内容更新。</p>
    <section id="today-audio" class="today-audio" aria-label="今日朗读" hidden></section>
    <div class="today-heading">
      <div><p class="eyebrow">TODAY FILES</p><h2>今日 5 篇</h2></div>
      <a class="text-link" href="discover.html?v=20261110-2">浏览更多内容 →</a>
    </div>
    <section id="today-list" class="today-list" aria-live="polite"><div class="empty-state">加载中…</div></section>
  </main>
  <footer data-site-footer></footer>
  <script src="../js/site.js?v=20261110-2"></script>
  <script src="../js/api-browser.js?v=20261110-2"></script>
  <script src="../js/major-event.js?v=20261110-2"></script>
  <script src="../js/today-audio.js?v=20261113-1"></script>
  <script>
    (async function () {
      const list = document.querySelector('#today-list')
      const state = document.querySelector('#jianwen-state')
      const count = document.querySelector('#today-count')
      const read = document.querySelector('#today-read')
      const progress = document.querySelector('#today-progress')
      const progressText = document.querySelector('#daily-progress')

      function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[char]))
      }

      function imageUrl(value) {
        if (!value) return ''
        try {
          if (!String(value).startsWith('/static/images/')) return ''
          let filename = decodeURIComponent(String(value).split('/').pop() || '')
          return filename ? `${jianwenApi.baseUrl()}/static/images/${encodeURIComponent(filename)}` : ''
        } catch { return '' }
      }

      function updateQuote(quote) {
        if (!quote) return
        const source = [quote.source_title, quote.source_author].filter(Boolean).join(' · ')
        document.querySelector('#daily-quote').textContent = quote.text || '今日金句正在整理中。'
        document.querySelector('#daily-quote-source').textContent = source || '见闻 · 每日金句'
        const explain = document.querySelector('#quote-explain')
        const plain = quote.plain_explanation || ''
        const connection = quote.today_connection || ''
        if (plain || connection) {
          explain.hidden = false
          explain.querySelector('[data-plain]').textContent = plain || '—'
          explain.querySelector('[data-connection]').textContent = connection || '—'
        }
      }

      try {
        const hasToken = Boolean(window.getToken())
        const [todayResult, quoteResult] = await Promise.all([
          hasToken ? jianwenApi.personalizedToday().catch(() => jianwenApi.today()) : jianwenApi.today(),
          jianwenApi.dailyQuote().catch(() => null)
        ])
        updateQuote(quoteResult)

        const localReadIds = window.getReadArticleIds()
        const rawArticles = (Array.isArray(todayResult) ? todayResult : (todayResult.articles || [])).slice(0, 5)
        const articles = rawArticles.map(item => {
          const id = item.article_id || item.id
          const localRead = localReadIds.includes(id)
          // 本地已读但服务端没记录（当时断网/后端维护）：补一次历史，避免任务统计丢篇。
          if (!item.viewed && localRead && hasToken) jianwenApi.saveHistory(id, item).catch(() => {})
          return { ...item, viewed: Boolean(item.viewed || localRead) }
        })
        const readCount = articles.filter(item => item.viewed).length
        const percentage = articles.length ? Math.round((readCount / articles.length) * 100) : 0

        count.textContent = articles.length
        read.textContent = readCount
        progress.textContent = `${percentage}%`
        progressText.textContent = articles.length
          ? `今日理解进度 ${percentage}%：已读 ${readCount} / ${articles.length} 篇。`
          : '今日内容正在整理中，稍后再来看看。'
        state.textContent = articles.length
          ? `已从见闻后端加载 ${articles.length} 篇今日文章。`
          : '今日内容正在整理中。'

        list.innerHTML = articles.map((item, index) => {
          const id = item.article_id || item.id
          const topic = item.topic || item.category || '今日简报'
          const description = item.desc || item.summary || '进入详情查看完整内容。'
          const source = [item.sources || item.source || '见闻整理', jianwenApi.articleUpdateLabel(item)].filter(Boolean).join(' · ')
          const readTime = item.read_time || item.reading_time || '约 5 分钟'
          const relation = item.relation || '公共议题 / 日常生活'
          const href = id ? `article.html?id=${encodeURIComponent(id)}` : 'article.html'
          const thumbnail = imageUrl(item.image)
          return `<a class="link-group briefing-card" href="${href}">
            <span class="briefing-rank" aria-hidden="true">${String(index + 1).padStart(2, '0')}</span>
            <span class="briefing-copy">
              <span class="eyebrow">${escapeHtml(topic)}</span>
              <h3>${escapeHtml(item.title || '未命名文章')}</h3>
              <p>${escapeHtml(description)}</p>
              <span class="briefing-meta"><span>${escapeHtml(relation)}</span><span>${escapeHtml(source)}</span><span>${escapeHtml(readTime)}</span><span class="read-state ${item.viewed ? 'viewed' : ''}">${item.viewed ? '已读' : '未读'}</span></span>
            </span>
            ${thumbnail ? `<img class="briefing-thumb" src="${escapeHtml(thumbnail)}" alt="" loading="lazy">` : ''}
            <span class="briefing-open" aria-hidden="true">→</span>
          </a>`
        }).join('') || '<div class="empty-state"><strong>今日暂未发布内容</strong><p>内容准备好后会出现在这里。</p></div>'
        // 听完今日朗读的一篇，等同读完：本地记已读、登录用户写阅读历史，并刷新进度与卡片状态。
        document.addEventListener('today-audio:listened', event => {
          const id = event.detail && event.detail.articleId
          const article = articles.find(item => (item.article_id || item.id) === id)
          if (!article || article.viewed) return
          window.markArticleRead(id)
          if (window.getToken()) jianwenApi.saveHistory(id, article).catch(() => {})
          article.viewed = true
          const done = articles.filter(item => item.viewed).length
          const pct = Math.round((done / articles.length) * 100)
          read.textContent = done
          progress.textContent = `${pct}%`
          progressText.textContent = `今日理解进度 ${pct}%：已读 ${done} / ${articles.length} 篇。`
          const badge = list.querySelectorAll('.briefing-card .read-state')[articles.indexOf(article)]
          if (badge) { badge.classList.add('viewed'); badge.textContent = '已读' }
        })
      } catch (error) {
        count.textContent = '—'
        read.textContent = '—'
        progress.textContent = '—'
        state.textContent = error.message
        progressText.textContent = '请通过 http://127.0.0.1:8765 打开官网，并确认后端已启动。'
        list.innerHTML = '<div class="empty-state"><strong>暂时无法获取今日内容</strong><p>不要直接双击 HTML 文件，请使用网站地址访问。</p><button class="button button-secondary" type="button" onclick="location.reload()">重新加载</button></div>'
      }
    })()
  </script>
</body>
</html>
