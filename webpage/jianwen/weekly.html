<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="same-origin">
  <meta name="description" content="见闻每周：每周视频回看这一周，个人周报收好你的阅读与追问。">
  <title>每周 · 见闻</title>
  <link rel="stylesheet" href="../css/site.css?v=20261115-4">
  <link rel="stylesheet" href="../css/pages/weekly-video.css?v=20261115-4">
  <link rel="stylesheet" href="../css/pages/jianwen-weekly.css?v=20261115-4">
  <link rel="stylesheet" href="../css/editorial.css?v=20261115-4">
  <style>
    .weekly-combined { padding-top: 44px; }
    .weekly-head h1 { margin: 0 0 10px; font-size: clamp(36px, 5vw, 56px); font-weight: 500; letter-spacing: -.03em; }
    .weekly-head p { margin: 0; color: var(--muted); font-size: 16px; }
    .weekly-tabs { display: flex; gap: 8px; margin: 28px 0 22px; border-bottom: 1px solid var(--line); }
    .weekly-tab { padding: 11px 18px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--muted); font: 15px system-ui, sans-serif; }
    .weekly-tab.is-active { color: var(--ink); border-bottom-color: var(--blue); font-weight: 600; }
    .weekly-panel { padding-top: 4px; }
    .weekly-panel[hidden] { display: none; }
    .weekly-controls[hidden], #download-report[hidden] { display: none; }
        .weekly-report-actions { display: flex; justify-content: flex-end; margin-top: 24px; }
    .weekly-combined .weekly-feature { padding-top: 0; }
    .weekly-combined .weekly-heading { padding-top: 0; }
    .weekly-combined .weekly-archive { margin-top: 40px; }
    .weekly-login-prompt { padding: 40px; border: 1px solid var(--line); text-align: center; background: var(--surface-card); }
    .weekly-login-prompt h2 { margin: 0 0 10px; font-size: 24px; }
    .weekly-login-prompt p { margin: 0 0 20px; color: var(--muted); }
    @media (max-width: 620px) {
      .weekly-report-top { flex-direction: column; }
      .weekly-tabs { margin-top: 22px; }
    }
  </style>
  <link rel="icon" href="../assets/agents-96.png?v=agents-1" type="image/png">
</head>
<body data-page="jianwen-weekly">
  <header data-site-header></header>
  <main class="page-shell weekly-page weekly-combined">
    <header class="weekly-head">
      <h1>每周</h1>
      <p>回看这一周，也看看自己的收获。</p>
    </header>
    <div class="weekly-tabs" role="tablist" aria-label="每周内容">
      <button type="button" role="tab" class="weekly-tab is-active" data-weekly-tab="video" aria-selected="true" aria-controls="weekly-video-panel">每周视频</button>
      <button type="button" role="tab" class="weekly-tab" data-weekly-tab="report" aria-selected="false" aria-controls="weekly-report-panel">我的周报</button>
    </div>

    <section id="weekly-video-panel" class="weekly-panel" role="tabpanel" aria-labelledby="weekly-video-tab">
      <section id="episode" class="weekly-feature" aria-label="本期节目" aria-busy="true">
        <p class="weekly-notice" role="status">正在载入节目…</p>
      </section>
      <section class="weekly-archive" aria-labelledby="archive-title">
        <div class="weekly-section-heading"><h2 id="archive-title">往期回看</h2><span id="archive-count"></span></div>
        <div id="archive-list"><p class="weekly-notice">往期节目将在这里保存。</p></div>
      </section>
    </section>

    <section id="weekly-report-panel" class="weekly-panel" role="tabpanel" aria-labelledby="weekly-report-tab" hidden>
      <nav class="weekly-controls" aria-label="选择周报日期">
        <button id="previous-week" class="button button-secondary" type="button">上一周</button>
        <label>选择日期 <input id="week-date" type="date" min="2000-01-03"></label>
        <button id="next-week" class="button button-secondary" type="button" disabled>下一周</button>
        <button id="current-week" class="button button-secondary" type="button">回到本周</button>
        <span>北京时间 · 周一至周日</span>
      </nav>
      <p id="weekly-status" role="status" aria-live="polite">正在整理你的周报…</p>
      <div id="weekly-report" aria-busy="true"></div>
      <div class="weekly-report-actions"><button id="download-report" class="button button-primary" type="button" disabled>下载完整长图</button></div>
      <div id="export-preview"></div>
    </section>
    <noscript><p class="weekly-notice">请启用 JavaScript 查看节目列表和周报。</p></noscript>
  </main>
  <footer data-site-footer></footer>
  <script src="../js/site.js?v=20261115-4"></script>
  <script src="../js/api-browser.js?v=20261115-4"></script>
  <script src="../js/weekly.js?v=20261115-4"></script>
  <script type="module" src="../js/weekly-video.mjs?v=20261115-4"></script>
  <script>
    (function () {
      const buttons = [...document.querySelectorAll('[data-weekly-tab]')]
      const panels = { video: document.querySelector('#weekly-video-panel'), report: document.querySelector('#weekly-report-panel') }
      function show(tab) {
        if (!panels[tab]) tab = 'video'
        buttons.forEach(button => {
          const active = button.dataset.weeklyTab === tab
          button.classList.toggle('is-active', active)
          button.setAttribute('aria-selected', active ? 'true' : 'false')
        })
        Object.entries(panels).forEach(([key, panel]) => { panel.hidden = key !== tab })
        if (tab === 'report') {
          const resize = () => window.dispatchEvent(new Event('resize'))
          requestAnimationFrame(resize)
          setTimeout(resize, 350)
          setTimeout(resize, 900)
        }
        if (location.hash !== '#' + tab) history.replaceState(null, '', '#' + tab)
      }
      buttons.forEach(button => button.addEventListener('click', () => show(button.dataset.weeklyTab)))
      show(location.hash === '#report' ? 'report' : 'video')
      window.addEventListener('hashchange', () => show(location.hash === '#report' ? 'report' : 'video'))
    })()
  </script>
</body>
</html>
