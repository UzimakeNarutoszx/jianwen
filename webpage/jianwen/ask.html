<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 问问 · 见闻</title>
  <link rel="stylesheet" href="../css/site.css?v=20261115-3">
  <link rel="stylesheet" href="../css/pages/jianwen-ask.css?v=20261114-3">

  <link rel="stylesheet" href="../css/ask.css?v=20261115-3">
<link rel="stylesheet" href="../css/editorial.css?v=20261115-3">
<link rel="icon" href="../assets/agents-96.png?v=agents-1" type="image/png">
<style>
  /* 回答下方的“依据”列表：每条都可点击跳到文章详情。 */
  .answer-citations {
    margin-top: 22px;
    padding: 18px 20px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: linear-gradient(180deg, rgba(31, 95, 122, 0.05), rgba(31, 95, 122, 0.015));
  }
  .answer-citations .citations-heading {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin: 0 0 10px;
    color: var(--blue);
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 0.08em;
  }
  .answer-citations .citations-count {
    color: var(--muted);
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0;
    font-variant-numeric: tabular-nums;
  }
  .answer-citations .citation-list {
    display: grid;
    gap: 4px;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .answer-citations .citation-link {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: start;
    gap: 10px;
    padding: 9px 10px;
    border-radius: 10px;
    color: inherit;
    text-decoration: none;
    transition: background 0.15s ease;
  }
  .answer-citations .citation-link:hover,
  .answer-citations .citation-link:focus-visible {
    background: rgba(31, 95, 122, 0.06);
  }
  .answer-citations .citation-link:focus-visible {
    outline: none;
    box-shadow: 0 0 0 1px rgba(31, 95, 122, 0.18), 0 0 0 4px rgba(31, 95, 122, 0.08);
  }
  .answer-citations .citation-number {
    color: var(--gold);
    font-size: 11px;
    font-weight: 900;
    line-height: 1.6;
    font-variant-numeric: tabular-nums;
  }
  .answer-citations .citation-text {
    display: flex;
    min-width: 0;
    flex-direction: column;
    gap: 3px;
  }
  .answer-citations .citation-name {
    color: var(--ink);
    font-size: 14px;
    font-weight: 600;
    line-height: 1.5;
    text-wrap: pretty;
  }
  .answer-citations .citation-quote {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.55;
    text-wrap: pretty;
  }
  .answer-citations .citation-arrow {
    color: var(--blue);
    font-size: 13px;
    line-height: 1.4;
  }
</style>
</head>
<body data-page="jianwen-ask">
  <header data-site-header></header>
  <main class="page-shell ask-page">
    <section class="ask-hero">
      <div>
        <p class="eyebrow">JIANWEN / POLICY RESEARCH ASSISTANT</p>
        <h1>把问题问深，<br>把判断落稳。</h1>
        <p>围绕政策、文章和正在发生的事继续追问。回答仅供学习与研究参考，请结合原文和可靠来源判断。</p>
        <p id="ai-quota" class="ai-quota" role="status" aria-live="polite">今日剩余额度：加载中</p>
      </div>
      <aside class="ask-status-card" aria-label="AI 服务状态">
        <span class="status-dot" aria-hidden="true"></span>
        <div><strong>见闻研究助理</strong><small id="context-state">可直接开始提问</small></div>
      </aside>
    </section>

    <section class="ask-workspace" aria-labelledby="ask-title">
      <div class="ask-prompts">
        <p class="eyebrow" id="ask-title">从这里开始</p>
        <h2>试着这样问</h2>
        <div class="prompt-grid">
          <button type="button" class="prompt-chip" data-question="这件事和我的生活有什么关系？">这件事和我的生活有什么关系？</button>
          <button type="button" class="prompt-chip" data-question="请用三点解释它的背景与影响。">请用三点解释它的背景与影响。</button>
          <button type="button" class="prompt-chip" data-question="我还应该核对哪些来源？">我还应该核对哪些来源？</button>
        </div>
      </div>
      <section id="ask-output" class="ask-answer" aria-label="AI 回答">
        <div class="answer-placeholder"><span class="icon" aria-hidden="true">✦</span><strong>等待你的问题</strong><p>选择一个推荐问题，或在下方输入自己的问题。</p></div>
      </section>
      <p id="ask-live" class="visually-hidden" role="status" aria-live="polite"></p>
    </section>

    <section id="ask-followups" class="ask-followups" hidden aria-label="下一步可以问">
      <h2>下一步可以问</h2>
      <div class="prompt-grid">
        <button type="button" class="prompt-chip" data-question="讲简单点">讲简单点</button>
        <button type="button" class="prompt-chip" data-question="和我有关吗？">和我有关吗？</button>
        <button type="button" class="prompt-chip" data-question="依据在哪里？">依据在哪里？</button>
      </div>
    </section>
    <form id="ask-form" class="ask-dock" novalidate>
      <span id="ai-quota-dock" class="ai-quota-dock" role="status" aria-live="polite">今日剩余额度：加载中</span>
      <input id="ask-input" aria-label="你的问题" required maxlength="4000" autocomplete="off" placeholder="例如：这件事和我有什么关系？">
      <button id="ask-stop" class="ask-stop" type="button" hidden>停止生成</button>
      <button id="ask-submit" class="button button-primary" type="submit">开始提问 <span class="icon" aria-hidden="true">→</span></button>
    </form>
    <div id="answer-actions" class="answer-actions" hidden><button id="ask-retry" type="button" hidden>重新尝试</button><button id="answer-copy-button" type="button" disabled>复制回答</button></div>
    <p id="ask-status" class="ask-feedback" role="status" aria-live="polite">每次提问独立生成回答；从文章进入时会带入该文章的上下文。</p>
    <p class="ask-note">提交问题即表示你理解：AI 回答可能不完整，应以原始资料和权威渠道为准。</p>
  </main>
  <footer data-site-footer></footer>
  <script src="../js/site.js?v=20261115-3"></script>
  <script src="../js/api-browser.js?v=20261115-3"></script>
  <script src="../js/ask.js?v=20261115-3"></script>
  <script>
    /* 引用来源：流式接口只返回纯文本，回答接收完后用最终文本回查一次，
       在回答卡片下方渲染可点击的“依据”。没有引用或解析失败就不显示。 */
    (function () {
      'use strict'
      var output = document.getElementById('ask-output')
      var input = document.getElementById('ask-input')
      var status = document.getElementById('ask-status')
      var retry = document.getElementById('ask-retry')
      if (!output || !input || typeof MutationObserver === 'undefined') return
      var pendingTimer = 0
      var requestSeq = 0

      var CITATIONS_KEY = 'jianwen_web_ask_citations'
      function clearCitations() {
        var existing = output.querySelector('.answer-citations')
        if (existing) existing.remove()
      }
      function storedQuestion() {
        try {
          var saved = JSON.parse(localStorage.getItem('jianwen_web_ask_last') || 'null')
          return saved && saved.question ? String(saved.question).trim() : ''
        } catch (error) { return '' }
      }
      function saveCitations(citations) {
        try {
          var question = String(input.value || '').trim() || storedQuestion()
          if (!question || !citations.length) return
          localStorage.setItem(CITATIONS_KEY, JSON.stringify({ question: question, citations: citations }))
        } catch (error) {}
      }
      function restoreCitations() {
        try {
          var saved = JSON.parse(localStorage.getItem(CITATIONS_KEY) || 'null')
          if (!saved || !Array.isArray(saved.citations) || !saved.citations.length) return
          var question = String(input.value || '').trim() || storedQuestion()
          if (!question || saved.question !== question) return
          if (output.querySelector('.answer-copy')) renderCitations(saved.citations)
        } catch (error) {}
      }

      function articleHref(articleId) {
        return 'article.html?id=' + encodeURIComponent(articleId) + '&from=ask'
      }

      function citationNumber(index) {
        var value = index + 1
        return value < 10 ? '0' + value : String(value)
      }

      function renderCitations(citations) {
        clearCitations()
        if (!Array.isArray(citations)) return
        var items = citations.filter(function (item) {
          return item && item.article_id && item.title
        })
        if (!items.length) return
        var section = document.createElement('section')
        section.className = 'answer-citations'
        section.setAttribute('aria-label', '回答依据')
        var heading = document.createElement('p')
        heading.className = 'citations-heading'
        heading.textContent = '依据'
        var count = document.createElement('span')
        count.className = 'citations-count'
        count.textContent = items.length + ' 篇原文'
        heading.appendChild(count)
        section.appendChild(heading)
        var list = document.createElement('ol')
        list.className = 'citation-list'
        items.forEach(function (item, index) {
          var row = document.createElement('li')
          row.className = 'citation-item'
          var link = document.createElement('a')
          link.className = 'citation-link'
          link.href = articleHref(item.article_id)
          var number = document.createElement('span')
          number.className = 'citation-number'
          number.textContent = citationNumber(index)
          var text = document.createElement('span')
          text.className = 'citation-text'
          var name = document.createElement('span')
          name.className = 'citation-name'
          name.textContent = item.title
          text.appendChild(name)
          if (item.quote) {
            var quote = document.createElement('span')
            quote.className = 'citation-quote'
            quote.textContent = item.quote
            text.appendChild(quote)
          }
          var arrow = document.createElement('span')
          arrow.className = 'citation-arrow'
          arrow.setAttribute('aria-hidden', 'true')
          arrow.textContent = '↗'
          link.appendChild(number)
          link.appendChild(text)
          link.appendChild(arrow)
          row.appendChild(link)
          list.appendChild(row)
        })
        section.appendChild(list)
        output.appendChild(section)
        saveCitations(items)
      }

      function readAnswer() {
        var copy = output.querySelector('.answer-copy')
        if (!copy) return ''
        return String(copy.innerText || copy.textContent || '').trim()
      }

      async function loadCitations() {
        var seq = ++requestSeq
        var answer = readAnswer()
        var question = String(input.value || '').trim()
        if (!answer || !question) {
          clearCitations()
          return
        }
        // 用户主动停止或请求出错时只拿到半截回答，不生成依据。
        if ((retry && !retry.hidden) || (status && /已停止生成/.test(status.textContent || ''))) {
          clearCitations()
          return
        }
        var token = typeof window.getToken === 'function' ? window.getToken() : ''
        var base = window.jianwenApi && typeof window.jianwenApi.baseUrl === 'function' ? window.jianwenApi.baseUrl() : ''
        try {
          var response = await fetch(base + '/api/v1/content/ask/citations', {
            method: 'POST',
            headers: Object.assign(
              { 'Content-Type': 'application/json' },
              token ? { Authorization: 'Bearer ' + token } : {}
            ),
            body: JSON.stringify({
              question: question,
              article_id: new URLSearchParams(location.search).get('article') || '',
              answer: answer
            })
          })
          if (!response.ok) return
          var data = await response.json()
          // 新一轮提问已经开始时，丢掉上一轮的迟到响应。
          if (seq !== requestSeq) return
          renderCitations(data && data.citations)
        } catch (error) {
          // 引用只是补充依据，拉取失败不影响回答。
        }
      }

      new MutationObserver(function () {
        if (output.getAttribute('aria-busy') !== 'false') {
          clearTimeout(pendingTimer)
          requestSeq++
          clearCitations()
          try { localStorage.removeItem(CITATIONS_KEY) } catch (error) {}
          return
        }
        clearTimeout(pendingTimer)
        pendingTimer = setTimeout(loadCitations, 120)
      }).observe(output, { attributes: true, attributeFilter: ['aria-busy'] })
      restoreCitations()
    })()
  </script>
</body>
</html>
