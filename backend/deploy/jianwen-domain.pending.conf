# Dedicated domain vhost. Keep the existing IP/garden/downloads vhost intact.
# Pending ICP approval: intentionally do not expose the application here.
server {
    listen 80;
    server_name jianwen.xin www.jianwen.xin;
    server_tokens off;
    access_log /var/log/nginx/jianwen-domain-access.log;
    error_log /var/log/nginx/jianwen-domain-error.log;

    location / {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 86400 always;
        return 503 "见闻：域名已关联，ICP备案尚未完成，网站暂未开放。\n";
    }
}
