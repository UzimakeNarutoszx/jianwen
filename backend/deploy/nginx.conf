# 归档文件：线上不使用本配置。
# 2026-11-22 核实：对外服务由 1Panel OpenResty 容器 1Panel-openresty-7PTV 提供，
# 站点 vhost 在 /opt/1panel/jianwen.xin/conf.d/，MIME 表在
# /opt/1panel/apps/openresty/openresty/conf/mime.types。修改本文件不会影响线上。
# 线上 MIME 修复请用 backend/deploy/mime-types-vtt.sh，不要照抄本文件里的 vtt 块。
server {
    listen 80;
    server_name 8.147.110.194;
    root /opt/jianwen/webpage;
    index index.html;
    server_tokens off;
    client_max_body_size 10m;

    # Cached pages used these original PNG paths; serve the compressed JPEG
    # under the legacy URL as well, so old page versions stay usable.
    location ~ ^/asset/images/(.+)\.png$ {
        alias /opt/jianwen/frontend/static/images/$1.jpg;
        types { }
        default_type image/jpeg;
        add_header Cache-Control "no-store" always;
    }

    location ~ \.mjs$ {
        types { application/javascript mjs; }
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # 每周视频字幕：Chrome 只接受 text/vtt，默认 mime.types 没有 .vtt
    location ~* \.vtt$ {
        types { text/vtt vtt; }
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    access_log /var/log/nginx/jianwen-access.log;
    error_log /var/log/nginx/jianwen-error.log;

    location = / {
        return 302 /jianwen/;
    }

    location ~ ^/(api/|health$|static/|public/|uploads/) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 240s;
    }

    location ~ (^|/)\. {
        deny all;
    }

    location ~ ^/(tests/|docs$|redoc$|openapi\.json$) {
        return 404;
    }

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ =404;
    }
}
