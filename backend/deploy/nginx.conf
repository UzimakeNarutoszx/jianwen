server {
    listen 80;
    server_name 8.147.110.194;
    root /opt/jianwen/webpage;
    index index.html;
    server_tokens off;
    client_max_body_size 10m;

    # Cached pages used these original PNG paths; serve the compressed JPEG
    # under the legacy URL as well, so old page versions stay usable.
    location ~ ^/asset/images/(.+)\.png$ {
        alias /opt/jianwen/frontend/static/images/$1.jpg;
        types { }
        default_type image/jpeg;
        add_header Cache-Control "no-store" always;
    }

    location ~ \.mjs$ {
        types { application/javascript mjs; }
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    access_log /var/log/nginx/jianwen-access.log;
    error_log /var/log/nginx/jianwen-error.log;

    location = / {
        return 302 /jianwen/;
    }

    location ~ ^/(api/|health$|static/|public/|uploads/) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 240s;
    }

    location ~ (^|/)\. {
        deny all;
    }

    location ~ ^/(tests/|docs$|redoc$|openapi\.json$) {
        return 404;
    }

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ =404;
    }
}
